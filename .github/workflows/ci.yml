name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run CLI smoke test
        run: |
          PYTHONPATH=src python -m x_knowledge_inbox.cli init /tmp/xki-ci.db
          PYTHONPATH=src python -m x_knowledge_inbox.cli import examples/sample-bookmarks.json --db /tmp/xki-ci.db
          PYTHONPATH=src python -m x_knowledge_inbox.cli list --db /tmp/xki-ci.db --query agent
