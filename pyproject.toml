[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-knowledge-inbox"
version = "0.1.0"
description = "A local-first inbox for turning X bookmarks into searchable, actionable knowledge."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "X Knowledge Inbox contributors"}]
keywords = ["x", "twitter", "bookmarks", "knowledge-management", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
x-knowledge-inbox = "x_knowledge_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
